name: Bug report
description: Something does not work, shows wrong information or looks broken.
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you see, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How can it be repeated?
      description: The steps that lead to the problem, for example "Clean up tab, tick Google Chrome cache, click Clean selected".
      placeholder: |
        1. ...
        2. ...
  - type: input
    id: version
    attributes:
      label: Version
      description: Shown in the About tab, for example 1.0.
    validations:
      required: true
  - type: dropdown
    id: windows
    attributes:
      label: Windows
      options:
        - Windows 11
        - Windows 10
    validations:
      required: true
  - type: input
    id: language
    attributes:
      label: App language
      placeholder: English
  - type: textarea
    id: pictures
    attributes:
      label: Screenshots
      description: Drag pictures here. Please hide anything private (user names, file names) first.
